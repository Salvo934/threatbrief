# Rapporto della notte: ultime 24 ore nel mondo (rivendicazioni, malware, KEV) con tecniche e difese.
# Automatico e pubblico (/minacce/notte), dichiarato come non rivisto da un analista.
name: Rapporto della notte

on:
  schedule:
    # Avvio principale: Worker «threatbrief-cron» su Cloudflare. Questi orari sono la riserva
    # (GitHub può ritardare o saltarli); genera solo il primo che arriva.
    - cron: "47 5 * * *"
    - cron: "53 9 * * *"
  workflow_dispatch:
    inputs:
      if_missing:
        description: "Salta se è già stato generato stamattina (usato dal Worker «sveglia»)"
        type: boolean
        default: false

concurrency:
  group: world-report
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A mano: rigenera sempre. Pianificato o dal Worker (if_missing): solo se manca quello di stamattina.
      - run: npm run ingest -- world ${{ (github.event_name == 'schedule' || inputs.if_missing) && '--if-missing' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
