# Feed leggeri, ogni 6 ore. Ogni fonte è isolata: se una fallisce le altre vengono
# comunque aggiornate e l'errore finisce nella pagina "Fonti" (la run risulta rossa).
name: Ingest feed

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

concurrency:
  group: ingest-feeds
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # kev, threatfox, urlhaus, otx, csirt, avvisi CISA, ransomware.live, pulizia IOC > 90 giorni,
      # bozze automatiche «Difesa e aerospazio» (con IA se ANTHROPIC_API_KEY è impostata)
      - run: npm run ingest -- feeds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
