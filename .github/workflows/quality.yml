# Controllo qualità dei dati: ogni settimana un campione di dati viene ricontrollato sulle
# fonti originali (CISA KEV, MITRE ATT&CK, ransomware.live, ThreatFox, citazioni dei report,
# CSIRT Italia) e il risultato è pubblico nella pagina /qualita.
name: Controllo qualità dei dati

# Avvio principale: Worker «threatbrief-cron» (lunedì). Orario di GitHub come riserva.
on:
  schedule:
    - cron: "47 9 * * 1"
  workflow_dispatch:

concurrency:
  group: quality
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest -- quality
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
