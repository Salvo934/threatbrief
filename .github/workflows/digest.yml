# Bozza del digest giornaliero: ogni mattina, dopo la raccolta delle 06:41 UTC.
# Genera solo la bozza (fatti + suggerimenti): la revisione la fa l'analista nell'app (/digest).
name: Digest giornaliero

on:
  schedule:
    # Avvio principale: Worker «threatbrief-cron» su Cloudflare. Questi orari sono la riserva
    # (GitHub può ritardare o saltarli); genera solo il primo che arriva.
    - cron: "13 8 * * *"
    - cron: "43 10 * * *"
  workflow_dispatch:
    inputs:
      if_missing:
        description: "Salta se è già stato generato stamattina (usato dal Worker «sveglia»)"
        type: boolean
        default: false

concurrency:
  group: digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A mano: rigenera sempre. Pianificato o dal Worker (if_missing): solo se manca quello di stamattina.
      - run: npm run ingest -- digest ${{ (github.event_name == 'schedule' || inputs.if_missing) && '--if-missing' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
